<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preconnect" href="%VITE_CONVEX_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_CONVEX_URL%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="canonical" href="https://www.splitzy.fr/" />
    <meta name="description" content="Splitzy simplifie le partage d'addition au restaurant. Scannez le QR code, choisissez vos plats et payez votre part en quelques secondes. Zéro calcul, zéro friction." />
    <title>Splitzy</title>

    <script>
      (function () {
        var m = location.pathname.match(/^\/t\/([^/]+)\/(\d+)/);
        if (!m) return;
        var slug = m[1];
        var tableNumber = Number(m[2]);
        if (!slug || !Number.isFinite(tableNumber)) return;

        var base = '%VITE_CONVEX_URL%';
        if (!base || base.indexOf('VITE_CONVEX_URL') !== -1) return;

        var ctrl = ('AbortController' in window) ? new AbortController() : null;
        if (ctrl) setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 8000);

        var t0 = Date.now();
        window.__tableBootstrap = fetch(base + '/api/query', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Convex-Client': 'splitzy-bootstrap'
          },
          body: JSON.stringify({
            path: 'restaurants:getTableContext',
            format: 'json',
            args: [{ slug: slug, tableNumber: tableNumber }]
          }),
          signal: ctrl ? ctrl.signal : undefined
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            try { console.info('[bootstrap]', Date.now() - t0, 'ms'); } catch (e) {}
            if (!d || d.status !== 'success') return null;
            return d.value;
          })
          .catch(function () { return null; });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
